name: CI

on:
  push:
    branches: ['**'] # not a bare `push:`, which would also run on tag pushes
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  # For a commit that only touched ignored paths: the release gate needs a CI run on it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The project's own script: locked restore + NuGet audit, build, tests, publish.
      - name: Build, test and publish
        shell: bash
        run: bash scripts/build.sh publish

      # Startup crashes (e.g. a XAML error) only show up on Windows; this catches them
      # and captures a screenshot of the window for review.
      - name: Smoke test (launch and screenshot)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'ShareHider-*-win-x64.exe' | Select-Object -First 1
          ./scripts/smoke-test.ps1 -Exe $exe.FullName -Screenshot dist/smoke-test.png

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-${{ github.sha }}
          path: dist/smoke-test.png
          if-no-files-found: ignore
          retention-days: 14

      # A downloadable test exe for every push, so testing never needs a release.
      - name: Upload test exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ShareHider-test-${{ github.sha }}
          path: |
            dist/ShareHider-*-win-x64.exe
            dist/ShareHider-*-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
